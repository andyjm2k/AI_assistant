name: CATBot Self Update

on:
  workflow_dispatch:
    inputs:
      update_command:
        description: Command to run that updates CATBot code
        required: false
        default: ""
  schedule:
    - cron: "13 */6 * * *"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: catbot-self-update
  cancel-in-progress: false

jobs:
  self-update:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install workflow dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install httpx

      - name: Run CATBot self-update command
        shell: bash
        env:
          DISPATCH_COMMAND: ${{ github.event.inputs.update_command }}
          DEFAULT_COMMAND: ${{ vars.CATBOT_SELF_UPDATE_COMMAND }}
        run: |
          set -euo pipefail

          COMMAND="${DISPATCH_COMMAND:-}"
          if [ -z "${COMMAND}" ]; then
            COMMAND="${DEFAULT_COMMAND:-}"
          fi

          if [ -z "${COMMAND}" ]; then
            echo "No self-update command configured."
            echo "Set repository variable CATBOT_SELF_UPDATE_COMMAND or pass workflow_dispatch input update_command."
            exit 0
          fi

          echo "Running self-update command: ${COMMAND}"
          eval "${COMMAND}"

      - name: Create pull request for generated changes
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(catbot): automated self-update"
          author: "CATBot <catbot@users.noreply.github.com>"
          committer: "CATBot <catbot@users.noreply.github.com>"
          branch: "catbot/self-update"
          branch-suffix: "timestamp"
          delete-branch: true
          base: ${{ github.event.repository.default_branch }}
          title: "chore(catbot): automated self-update"
          body: |
            Automated update generated by the `catbot-self-update` workflow.

            - Trigger: `${{ github.event_name }}`
            - Workflow run: `${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}`
          labels: |
            automation
            catbot
